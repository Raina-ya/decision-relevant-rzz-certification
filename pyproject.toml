[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-relevant-rzz-certification"
version = "0.0.0"
description = "Decision-relevant certification for native fractional RZZ gates"
requires-python = ">=3.11"
authors = [{name = "Zhen-Jun Liu"}]

[tool.setuptools]
packages = ["rzzcert"]
package-dir = {"rzzcert" = "src"}

